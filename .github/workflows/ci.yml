name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, typecheck, test, e2e, migration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: vibe_ci
          POSTGRES_DB: vibe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vibe -d vibe_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CI: 'true'
      DATABASE_URL: postgresql://vibe:vibe_ci@localhost:5432/vibe_test
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql://vibe:vibe_ci@localhost:5432/vibe_test
      TEST_REDIS_URL: redis://localhost:6379/1
      # Yalnızca-geliştirme anahtarları ("dev-only" önekli; production'da uygulama başlamaz).
      PHONE_HMAC_KEY: ZGV2LW9ubHktcGhvbmUtaG1hY4+WnaSrsrnAx87V3OM=
      PHONE_ENCRYPTION_KEY: ZGV2LW9ubHktcGhvbmUtZW5jIY+WnaSrsrnAx87V3OM=
      JWT_ACCESS_SECRET: ZGV2LW9ubHktand0LWFjY2Vzc4+WnaSrsrnAx87V3OPq8fj/Bg0UGyIpMDc+RUxT
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint --workspace @vibe/api
      - run: npm run typecheck --workspace @vibe/api
      - run: npm run build --workspace @vibe/api
      - run: npm run test --workspace @vibe/api
      - run: npm run test:e2e --workspace @vibe/api
      - name: API sözleşmesi (OpenAPI + tipler) güncel mi
        run: |
          npm run contract:generate
          git diff --exit-code -- packages/api-contract
      - name: Şema ile migration'lar uyumlu mu (drift)
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  mobile:
    name: Mobile (lint, typecheck, expo-doctor)
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      EXPO_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @vibe/mobile
      - run: npm run typecheck --workspace @vibe/mobile
      - run: npm run test --workspace @vibe/mobile
      - name: expo-doctor
        working-directory: apps/mobile
        run: npx expo-doctor
